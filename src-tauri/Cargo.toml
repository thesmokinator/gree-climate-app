[package]
name = "gree-climate-app"
version = "0.1.0"
description = "Menu-bar companion for GREE air conditioners"
authors = ["Michele Broggi"]
license = "MIT"
repository = "https://github.com/thesmokinator/gree-climate-app"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gree-climate = "0.1"
tokio = { version = "1", features = ["time"] }
